<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儿童打字游戏 - 第一阶段</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 儿童打字乐园</h1>
            <p class="subtitle">第一阶段：认识键盘</p>
        </header>

        <main class="game-selection">
            <div class="stage-info">
                <h2>🌟 第一阶段：认识键盘</h2>
                <p>让我们一起认识键盘上的字母朋友吧！</p>
            </div>

            <div class="games-grid">
                <div class="game-card" onclick="location.href='games/keyboard-farm.html'">
                    <div class="game-icon">🌾</div>
                    <h3>键盘农场</h3>
                    <p>种下字母种子，收获美味水果</p>
                    <div class="stars">
                        <span class="star">⭐</span>
                        <span class="star empty">⭐</span>
                        <span class="star empty">⭐</span>
                    </div>
                    <button class="play-btn">开始游戏</button>
                </div>

                <div class="game-card" onclick="location.href='games/bubble-pop.html'">
                    <div class="game-icon">🫧</div>
                    <h3>字母泡泡</h3>
                    <p>消除飘落的字母泡泡</p>
                    <div class="stars">
                        <span class="star empty">⭐</span>
                        <span class="star empty">⭐</span>
                        <span class="star empty">⭐</span>
                    </div>
                    <button class="play-btn">开始游戏</button>
                </div>
            </div>

            <div class="stage-info" style="margin-top: 40px;">
                <h2>🎯 第二阶段：手指分工</h2>
                <p>学习标准指法，让每个手指都找到自己的家！</p>
            </div>

            <div class="games-grid">
                <div class="game-card" onclick="location.href='games/finger-home.html'">
                    <div class="game-icon">👋</div>
                    <h3>小手找家</h3>
                    <p>学习正确的手指位置和分工</p>
                    <div class="stars">
                        <span class="star empty">⭐</span>
                        <span class="star empty">⭐</span>
                        <span class="star empty">⭐</span>
                    </div>
                    <button class="play-btn">开始游戏</button>
                </div>

                <div class="game-card" onclick="location.href='games/music-jump.html'">
                    <div class="game-icon">🎵</div>
                    <h3>音符跳跃</h3>
                    <p>跟随音乐节奏练习打字</p>
                    <div class="stars">
                        <span class="star empty">⭐</span>
                        <span class="star empty">⭐</span>
                        <span class="star empty">⭐</span>
                    </div>
                    <button class="play-btn">开始游戏</button>
                </div>
            </div>

            <div class="progress-section">
                <h3>📊 学习进度</h3>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 15%"></div>
                </div>
                <p>已完成 15% - 继续加油！</p>
            </div>
        </main>

        <footer>
            <p>💡 提示：保持正确的坐姿，手指放在键盘上</p>
        </footer>
    </div>

    <script>
        // 加载游戏进度和星级
        function loadGameProgress() {
            // 加载键盘农场星级
            const farmStars = parseInt(localStorage.getItem('keyboard-farm-stars') || 0);
            updateStarDisplay('keyboard-farm', farmStars);
            
            // 加载字母泡泡星级
            const bubbleStars = parseInt(localStorage.getItem('bubble-pop-stars') || 0);
            updateStarDisplay('bubble-pop', bubbleStars);
            
            // 加载小手找家星级
            const fingerStars = parseInt(localStorage.getItem('finger-home-stars') || 0);
            updateStarDisplay('finger-home', fingerStars);
            
            // 加载音符跳跃星级
            const musicStars = parseInt(localStorage.getItem('music-jump-stars') || 0);
            updateStarDisplay('music-jump', musicStars);
            
            // 计算总进度
            const totalStars = farmStars + bubbleStars + fingerStars + musicStars;
            const maxStars = 12; // 四个游戏，每个最多3星
            const progress = Math.round((totalStars / maxStars) * 100);
            
            document.querySelector('.progress-fill').style.width = progress + '%';
            document.querySelector('.progress-section p').textContent = 
                `已完成 ${progress}% - ${progress === 100 ? '太棒了！' : '继续加油！'}`;
        }
        
        // 更新星星显示
        function updateStarDisplay(gameId, stars) {
            const gameCards = document.querySelectorAll('.game-card');
            let targetCard;
            
            if (gameId === 'keyboard-farm') {
                targetCard = gameCards[0];
            } else if (gameId === 'bubble-pop') {
                targetCard = gameCards[1];
            } else if (gameId === 'finger-home') {
                targetCard = gameCards[2];
            } else if (gameId === 'music-jump') {
                targetCard = gameCards[3];
            }
            
            if (targetCard) {
                const starElements = targetCard.querySelectorAll('.star');
                starElements.forEach((star, index) => {
                    if (index < stars) {
                        star.classList.remove('empty');
                    } else {
                        star.classList.add('empty');
                    }
                });
            }
        }
        
        // 页面加载时执行
        window.addEventListener('DOMContentLoaded', loadGameProgress);
    </script>
</body>
</html>
